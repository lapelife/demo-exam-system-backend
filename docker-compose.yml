# Docker Compose：MySQL + 后端
# 前端本地：cd frontend && npm run dev（代理到 :8080）

services:
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: exam_system
    ports:
      - "3306:3306"
    volumes:
      - exam_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./demo-exam-system-backend
      dockerfile: Dockerfile
    container_name: exam-backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: docker-exam-jwt-secret-key-change-me-please-xxxx
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/exam_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  exam_mysql_data:
