# Docker Compose：MySQL + 考试后端 +（可选）AI 出题服务
# 在本文件所在目录执行：docker compose up -d --build
# 前端本地：cd ../demo-exam-system-frontend && npm run dev
#   /api → :8080，/ai-api → :8081

services:
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: exam_system
    ports:
      - "3306:3306"
    volumes:
      - exam_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: docker-exam-jwt-secret-key-change-me-please-xxxx
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/exam_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  # 独立 AI 出题服务（可不启动；考试系统本身不依赖它）
  ai-service:
    build:
      context: ../demo-exam-ai-service
      dockerfile: Dockerfile
    container_name: exam-ai-service
    ports:
      - "8081:8081"
    environment:
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_MODEL: ${AI_MODEL:-glm-4-flash}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_DATA_DIR: /app/data
    volumes:
      # 文章库 H2 数据持久化（与 AI_DATA_DIR 一致）
      - exam_ai_data:/app/data

volumes:
  exam_mysql_data:
  exam_ai_data:
