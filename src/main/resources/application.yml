server:
  port: 8080

spring:
  application:
    name: exam-system

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/exam_system?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT 配置
jwt:
  secret: yuan-exam-system-secret-key-2026-very-long-xxxxxxxxxxxxxx
  expiration: 86400000  # 24 小时（毫秒）
