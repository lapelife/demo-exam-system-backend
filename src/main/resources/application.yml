server:
  port: 8080

spring:
  application:
    name: exam-system

  # 数据源配置（可用环境变量 DB_USERNAME / DB_PASSWORD 覆盖）
  datasource:
    url: jdbc:mysql://localhost:3306/exam_system?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT 配置（可用环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:yuan-exam-system-secret-key-2026-very-long-xxxxxxxxxxxxxx}
  expiration: 86400000  # 24 小时（毫秒）
